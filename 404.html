<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>페이지를 옮겼습니다 | 콘텐츠랩스</title>
<link rel="icon" href="/favicon.ico">
<script>
/* 예전 홈페이지(WordPress) 주소 → 새 홈페이지 섹션으로 이동
   - 메뉴 주소는 같은 이름의 섹션으로
   - 제작 유형을 다룬 예전 글은 「제작 포맷」으로
   - 그 밖의 예전 글·카테고리·태그는 「블로그」로
   규칙을 고칠 때는 아래 RULES만 수정 */
(function () {
  var path;
  try { path = decodeURIComponent(location.pathname); } catch (e) { path = location.pathname; }
  path = path.toLowerCase().replace(/\/+$/, '') || '/';
  var seg = path.split('/')[1] || '';
  var RULES = [
    [/^\/(wp-|feed|xmlrpc|wp$)/,                                         '/'],
    [/^\/(about|company|intro|회사소개|소개)/,                              '/#about'],
    [/^\/(service|services|business|사업|서비스)/,                          '/#business'],
    [/^\/(contact|inquiry|estimate|quote|문의|제작-?문의|견적)/,              '/#contact'],
    [/^\/(partner|partners|client|clients|customer|고객사|파트너)/,          '/#hero'],
    [/^\/(solution|solutions|lms|cdms|솔루션)/,                            '/#solutions'],
    [/^\/(portfolio|works?|포트폴리오)/,                                    '/#formats'],
    [/(전자칠판|크로마키|모션|애니메이션|현장촬영|html5|스마트|제작-?유형|제작유형|촬영편집|시뮬레이션|1인강의)/, '/#formats'],
    [/^\/(blog|category|tag|author|page|archives|insight|guide|이러닝)/,    '/#blog']
  ];
  var to = null;
  for (var i = 0; i < RULES.length; i++) { if (RULES[i][0].test(path)) { to = RULES[i][1]; break; } }
  /* 위 규칙에 없는 한 단계짜리 주소(/한미글로벌 처럼 예전 글 제목) → 블로그 */
  if (!to) to = (path.split('/').length === 2 && seg) ? '/#blog' : '/';
  window.__to = to;
  location.replace(to);
})();
</script>
<style>
  :root{--bg:#F5F6F0;--ink:#15171A;--muted:#5E6460;--lime:#C9F04A}
  @media (prefers-color-scheme:dark){:root{--bg:#111312;--ink:#EEF0EA;--muted:#9BA29C}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
       font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;text-align:center;padding:24px}
  h1{font-size:22px;margin:0 0 10px} p{color:var(--muted);margin:0 0 22px;line-height:1.6}
  a.btn{display:inline-block;background:var(--lime);color:#15171A;text-decoration:none;font-weight:700;
        padding:12px 22px;border-radius:999px}
</style>
</head>
<body>
  <main>
    <h1>홈페이지가 새로 바뀌었습니다</h1>
    <p>찾으시는 페이지는 새 홈페이지로 옮겨졌습니다.<br>잠시 후 자동으로 이동합니다.</p>
    <a class="btn" id="go" href="/">콘텐츠랩스 홈으로</a>
  </main>
  <script>if (window.__to) document.getElementById('go').href = window.__to;</script>
</body>
</html>
